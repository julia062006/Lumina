services:
  database:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    expose:
     - "3306" 
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: nginx_container
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./certs:/etc/nginx/certs
    depends_on:
      - backend
      - frontend
    networks:
      - app-network

  backend:
    build:
      context: ./Lumina_Backend
      dockerfile: Dockerfile
    container_name: backend_service
    environment: 
       DB_HOST: database
       DB_PORT: 3306
       DB_NAME: ${MYSQL_DATABASE}
       DB_USER: ${MYSQL_USER}
       DB_PASS: ${MYSQL_PASSWORD}
    expose:
      - 3000
    depends_on:
      - database
    networks:
      - app-network

  frontend:
    build:
      context: ./Lumina_Frontend
      dockerfile: Dockerfile
    container_name: frontend_service
    expose:
      - "3001"
    depends_on:
      - database
      - backend
    networks:
      - app-network
  
volumes:
  mysql-data:

networks:
  app-network: